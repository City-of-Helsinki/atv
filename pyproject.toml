[project]
name = "atv"
requires-python = ">=3.12, <3.13"
version = "2.2.6"
dependencies = [
    "django~=5.2",
    "django-cors-headers",
    "django-environ",
    "django-filter",
    "django-guardian",
    "django-helusers>=1.2.0",
    "social-auth-app-django",
    "django-helsinki-health-endpoints",
    "django-logger-extra",
    "django-resilient-logger",
    "django-searchable-encrypted-fields",
    "djangorestframework",
    "djangorestframework-api-key",
    "drf-extensions",
    "drf-spectacular",
    "psycopg[c]",
    "sentry-sdk[django]",
    "elasticsearch<9",
    "pyclamd",
    "jsonschema",
]

[dependency-groups]
dev = [
    "factory-boy",
    "freezegun",
    "ipython",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "pytest-factoryboy",
    "syrupy",
]
prod = [
    "uwsgi",
    "uwsgitop",
]

[tool.uv]
package = false
exclude-newer = "P3D"

[tool.uv.exclude-newer-package]
django-helusers = "2026-08-04T00:00:00Z"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # pycodestyle
    "E",
    "W",
    # isort
    "I",
    # pep8-naming
    "N",
    # flake8-bugbear without opinionated rules
    "B0",
    # flake8-pie
    "PIE",
    # flake8-print
    "T20",
]
extend-per-file-ignores = { "*/migrations/*" = ["E501"], "*/tests/*" = ["E501"] }

[tool.coverage.run]
branch = true
omit = ["*migrations*", "*site-packages*", "*venv*", "*tests*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "atv.settings"
norecursedirs = [".git", "venv*", "var"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "IGNORE_EXCEPTION_DETAIL", "ALLOW_UNICODE"]
